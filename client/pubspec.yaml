name: chatpapol
description: Chat privado tipo Discord, ultraligero.
publish_to: "none"
version: 0.2.5+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  livekit_client: ^2.5.0
  # acceso directo a desktopCapturer para elegir pantalla/ventana al compartir
  flutter_webrtc: any
  http: ^1.2.0
  http_parser: ^4.1.0
  cross_file: ^0.3.4
  web_socket_channel: ^3.0.0
  file_picker: ^11.0.0
  # arrastrar archivos a la ventana para adjuntarlos al chat
  desktop_drop: ^0.7.1
  # QR del enrolamiento 2FA (TOTP)
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.0
  # FFI hacia la lib nativa de efectos de voz (client/native/voicefx)
  ffi: ^2.1.0
  path_provider: ^2.1.0
  crypto: ^3.0.0
  # ventana sin marco del OS: barra de título y botones propios
  window_manager: ^0.4.3
  # notificaciones nativas del SO (Windows/Linux/macOS) — toasts de menciones
  local_notifier: ^0.1.6
  # descompresión del paquete de actualización (instalador/updater propio)
  archive: ^3.6.0
  path: ^1.9.0
  lucide_icons_flutter: ^3.1.14+2
  # redimensiona/comprime avatares en el cliente antes de subir (pura Dart, sin
  # deps nativas) → no se guardan imágenes raw y nunca topan el límite de 2MB
  image: ^4.3.0
dev_dependencies:
  flutter_lints: ^6.0.0
  # Genera los iconos de launcher de Android desde assets/icon.png:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

# Icono de la app en Android. Adaptativo (fondo violeta oscuro acorde al tema +
# logo en primer plano) y legacy. Regenerar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#17131f"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 24

# Autorizado explícitamente por el usuario (2026-06-10) para tener audio del
# sistema en el screen share: flutter-webrtc pineado a un commit FIJO de su
# main oficial (incluye el loopback WASAPI de Windows, PR #2060, mergeado el
# 2026-06-02 y aún sin release). Quitar cuando salga la release oficial.
dependency_overrides:
  # [chatpapol] fork propio con RNNoise + efectos de voz (voicefx) + micro
  # fullband 48k (pista kCustom sin APM), sobre el commit 3931f2 de flutter-webrtc
  # (loopback WASAPI). Rama chatpapol-rnnoise, pineado al SHA. Para iterar en
  # local: cambiar a `path: ../../flutter-webrtc-fork`.
  flutter_webrtc:
    git:
      url: https://github.com/servo98/flutter-webrtc.git
      ref: 3f54f5fda8b8db067ea0776549227f4ff9f5c8ee

flutter:
  uses-material-design: true
  assets:
    # Ambientes de sala (beds loopables; se reproducen en sincronía vía gateway,
    # NO por WebRTC). Generables con scripts/gen_ambience.py o sustituibles por un
    # pack royalty-free con los mismos nombres. Ver lib/ambience.dart.
    - assets/ambience/
    - assets/ambience_manifest.json
    # SFX de UI horneados (pack Cyberleaf ModernUISFX). Generados con
    # scripts/gen_sfx.dart desde el manifest del Sound Lab.
    - assets/sfx/
    - assets/sfx_manifest.json

