name: chatpapol
description: Chat privado tipo Discord, ultraligero.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  livekit_client: ^2.5.0
  # acceso directo a desktopCapturer para elegir pantalla/ventana al compartir
  flutter_webrtc: any
  http: ^1.2.0
  http_parser: ^4.1.0
  cross_file: ^0.3.4
  web_socket_channel: ^3.0.0
  file_picker: ^11.0.0
  # arrastrar archivos a la ventana para adjuntarlos al chat
  desktop_drop: ^0.7.1
  # QR del enrolamiento 2FA (TOTP)
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  crypto: ^3.0.0
  # ventana sin marco del OS: barra de título y botones propios
  window_manager: ^0.4.3
  # descompresión del paquete de actualización (instalador/updater propio)
  archive: ^3.6.0
  path: ^1.9.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

