# Imagen Docker del server → GitHub Container Registry (gratis en repos públicos).
# Se reconstruye en cada push a main que toque server/**.
name: docker
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/docker.yml"]

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/servo98/chatpapol-server:latest
            ghcr.io/servo98/chatpapol-server:${{ github.sha }}
