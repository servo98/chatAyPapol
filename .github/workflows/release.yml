# Compila el cliente Linux (AppImage) y publica la GitHub Release.
# Windows YA NO se compila aquí (tarda demasiado): se construye en local con
# client/scripts/publish-windows.sh y se sube al mismo release con gh.
# Se dispara de dos formas:
#   - manual: empujar un tag vX.Y.Z
#   - automática: lo invoca auto-release.yml cuando cambia client/** en main
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      version:
        description: "Versión x.y.z (sin la v)"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v5
      - name: Dependencias de build (toolchain Flutter + GStreamer para audioplayers + FUSE para AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libnotify-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libpulse-dev
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Sellar versión
        run: |
          RAW="${{ inputs.version || github.ref_name }}"
          echo "const appVersion = '${RAW#v}';" > lib/version.dart
      - run: flutter build linux --release
      - run: ./packaging/make-appimage.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: client/packaging/out/*.AppImage }

  # Compila el APK de Android. El runner de GitHub trae el SDK; aseguramos la
  # plataforma 36 que exigen flutter_webrtc (fork) + livekit_client. APK firmado
  # con la debug key por ahora (sirve para sideload; para Play Store hace falta
  # un keystore propio vía android/key.properties — pendiente).
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Asegurar SDK Android 36
        run: yes | sdkmanager "platforms;android-36" >/dev/null 2>&1 || true
      - name: Sellar versión
        run: |
          RAW="${{ inputs.version || github.ref_name }}"
          echo "const appVersion = '${RAW#v}';" > lib/version.dart
      - name: Build APK release
        run: |
          RAW="${{ inputs.version || github.ref_name }}"
          flutter build apk --release \
            --build-name="${RAW#v}" --build-number="${{ github.run_number }}"
      - name: Renombrar APK con la versión
        run: |
          RAW="${{ inputs.version || github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/ChatPapol-${RAW#v}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: client/build/app/outputs/flutter-apk/ChatPapol-*.apk

  publish:
    needs: [linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true, path: dist }
      - name: Resolver tag
        id: v
        run: |
          RAW="${{ inputs.version || github.ref_name }}"
          echo "tag=v${RAW#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
