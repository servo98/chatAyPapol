# Compila el cliente (Windows + Linux) y publica la GitHub Release.
# Se dispara de dos formas:
#   - manual: empujar un tag vX.Y.Z
#   - automática: lo invoca auto-release.yml cuando cambia client/** en main
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      version:
        description: "Versión x.y.z (sin la v)"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Sellar versión
        shell: bash
        run: |
          RAW="${{ inputs.version || github.ref_name }}"
          echo "const appVersion = '${RAW#v}';" > lib/version.dart
      - run: flutter build windows --release
        env:
          # audioplayers_windows usa <experimental/coroutine>; el MSVC nuevo lo
          # trata como error salvo que se silencie explícitamente
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      - name: Instalador Inno Setup
        shell: pwsh
        run: |
          $v = "${{ inputs.version || github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss /DAppVersion=$v
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: client/packaging/out/*.exe }

  linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v5
      - name: Dependencias de build (toolchain Flutter + GStreamer para audioplayers + FUSE para AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Sellar versión
        run: |
          RAW="${{ inputs.version || github.ref_name }}"
          echo "const appVersion = '${RAW#v}';" > lib/version.dart
      - run: flutter build linux --release
      - run: ./packaging/make-appimage.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: client/packaging/out/*.AppImage }

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true, path: dist }
      - name: Resolver tag
        id: v
        run: |
          RAW="${{ inputs.version || github.ref_name }}"
          echo "tag=v${RAW#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
