# LiveKit SFU — config mínima para ChatPapol.
# PRODUCCIÓN: cambia las keys (genera con: ./bin/livekit-server generate-keys)
# y ponlas también en el .env del server (LIVEKIT_KEY / LIVEKIT_SECRET).
port: 7880
rtc:
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
audio:
  # aro de "hablando" SENSIBLE (-30 dBFS, el default) y updates cada 150ms:
  # si alguien te oye, su aro debe prender. El aro PROPIO ni pasa por aquí
  # (detección local del nivel enviado, ver voice.dart _startSelfSpeaking).
  active_level: 30
  min_percentile: 40
  update_interval: 150
  smooth_intervals: 2
keys:
  devkey: devsecret-devsecret-devsecret-32
logging:
  level: info
